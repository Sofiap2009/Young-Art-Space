
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar sesión | Young Art Space</title>
    <link rel="stylesheet" href="login.css">
</head>
<body>

    <main class="contenedor-login">

        <section class="panel-bienvenida">
            <a href="index.html" class="logo">Young Art Space</a>

            <div class="mensaje">
                <h1>¡Qué bueno tenerte aquí!</h1>
                <p>
                    Un espacio para imaginar, crear y compartir.
                    Tu creatividad comienza aquí.
                </p>
            </div>
        </section>

        <section class="panel-formulario">

            <h2>Iniciar sesión</h2>
            <p class="subtitulo">Ingresa a tu espacio creativo.</p>

            <form id="formulario-login">

                <label for="correo">Correo electrónico</label>
                <input
                    type="email"
                    id="correo"
                    name="correo"
                    placeholder="nombre@correo.com"
                    required
                >

                <label for="contrasena">Contraseña</label>

                <div class="campo-contrasena">
                    <input
                        type="password"
                        id="contrasena"
                        name="contrasena"
                        placeholder="Escribe tu contraseña"
                        required
                    >

                    <button type="button" id="mostrar-contrasena">
                        Mostrar
                    </button>
                </div>

                <button type="submit">Iniciar sesión</button>

            </form>

            <p class="registro">
                ¿No tienes una cuenta?
                <a href="registro.html">Regístrate</a>
            </p>

            <a href="index.html" class="volver">Volver al inicio</a>

        </section>

    </main>

    <script>
        const contrasena = document.getElementById("contrasena");
        const botonMostrar = document.getElementById("mostrar-contrasena");
        const formulario = document.getElementById("formulario-login");

        // Mostrar u ocultar contraseña
        botonMostrar.addEventListener("click", function () {
            if (contrasena.type === "password") {
                contrasena.type = "text";
                botonMostrar.textContent = "Ocultar";
            } else {
                contrasena.type = "password";
                botonMostrar.textContent = "Mostrar";
            }
        });

        // Iniciar sesión
        formulario.addEventListener("submit", async function(event) {
            event.preventDefault();

            const correo = document.getElementById("correo").value.trim();
            const clave = contrasena.value;

            try {
                const respuesta = await fetch(
                    "https://young-art-space-api.onrender.com/api/usuarios/login",
                    {
                        method: "POST",
                        headers: {
                            "Content-Type": "application/json"
                        },
                        body: JSON.stringify({
                            correo: correo,
                            contrasena: clave
                        })
                    }
                );

                const resultado = await respuesta.json();

                if (!respuesta.ok) {
                    throw new Error(resultado.mensaje);
                }

                localStorage.setItem("nombreUsuario", resultado.nombre);

                alert("¡Bienvenido/a, " + resultado.nombre + "!");

                window.location.href = "index.html";

            } catch (error) {
                alert(error.message || "No se pudo conectar con el servidor.");
            }
        });
    </script>

</body>
</html>
